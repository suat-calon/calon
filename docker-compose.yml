name: calon

# =============================================================================
# CALON — LOCAL DEVELOPMENT STACK
# PostgreSQL 16 + Redis 7 + API + Worker
# =============================================================================

networks:
  calon_network:
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: calon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       calon_dev
      POSTGRES_USER:     postgres          # Superuser (migration için)
      POSTGRES_PASSWORD: postgres_secret   # Geliştirme ortamı
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # İlk başlatmada calon_app rolünü otomatik oluştur
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - calon_network
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U postgres -d calon_dev"]
      interval: 5s
      timeout:  5s
      retries:  10

  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: calon_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - calon_network
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  5

  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: calon_api
    restart: unless-stopped
    environment:
      NODE_ENV:    production
      PORT:        "4000"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST:  ${REDIS_HOST:-redis}
      REDIS_PORT:  ${REDIS_PORT:-6379}
      JWT_SECRET:        ${JWT_SECRET}
      IYZICO_API_KEY:    ${IYZICO_API_KEY}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY}
      IYZICO_BASE_URL:   ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
      IYZICO_CALLBACK_URL: ${IYZICO_CALLBACK_URL:-}
      SITE_URL:    ${SITE_URL:-http://localhost:3000}
      APP_URL:     ${APP_URL:-http://localhost:3000}
      BOOKING_URL: ${BOOKING_URL:-http://localhost:3001}
      API_URL:     ${API_URL:-http://localhost:4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - calon_network
    healthcheck:
      test:         ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 30s

  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: calon_worker
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV:    production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST:  ${REDIS_HOST:-redis}
      REDIS_PORT:  ${REDIS_PORT:-6379}
      JWT_SECRET:        ${JWT_SECRET}
      IYZICO_API_KEY:    ${IYZICO_API_KEY}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY}
      IYZICO_BASE_URL:   ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
      IYZICO_CALLBACK_URL: ${IYZICO_CALLBACK_URL:-}
      SITE_URL:    ${SITE_URL:-http://localhost:3000}
      APP_URL:     ${APP_URL:-http://localhost:3000}
      BOOKING_URL: ${BOOKING_URL:-http://localhost:3001}
      API_URL:     ${API_URL:-http://localhost:4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - calon_network
    # Worker HTTP sunucusu çalıştırmaz — wget tabanlı Dockerfile HEALTHCHECK override edildi.
    # Proses hayatta ise "healthy" sayılır; restart policy crash loop'u yakalar.
    healthcheck:
      test:         ["CMD-SHELL", "pgrep -f 'node dist/worker' || exit 1"]
      interval:     30s
      timeout:      5s
      retries:      3
      start_period: 30s

volumes:
  # Faz 21.5: Calon brand — volume'lar compose-managed named volume olarak tanımlandı.
  # İlk çalıştırmada Docker Compose otomatik oluşturur.
  # Faz 21.6: external: false — Docker Compose'un kendi yönetiminde; dışarıdan pre-created değil.
  postgres_data:
    name: calon_postgres_data
    external: false
  redis_data:
    name: calon_redis_data
    external: false
